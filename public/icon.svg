<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="irid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a3ffc"/>
      <stop offset="100%" stop-color="#ff5277"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#ff5277"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#irid)" stroke-width="6" opacity="0.8"/>
  
  <!-- Holographic Targeting Grid & Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 14" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#8a3ffc" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
  <line x1="256" y1="36" x2="256" y2="476" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>

  <!-- Centered AI typography -->
  <g filter="url(#glow)">
    <text x="210" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="210" fill="url(#aGrad)" text-anchor="middle" letter-spacing="-8">A</text>
    <text x="325" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="210" fill="url(#iGrad)" text-anchor="middle" letter-spacing="-8">I</text>
  </g>

  <!-- Subtitle -->
  <text x="256" y="420" font-family="monospace" font-weight="700" font-size="24" fill="#00f0ff" text-anchor="middle" letter-spacing="8" opacity="0.9">F.R.I.D.A.Y.</text>
</svg>
